<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings — MasteringAIWithAni</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header>
    <h1>Global Settings</h1>
    <p>Configure default modes and accessibility preferences.</p>
  </header>

  <main>
    <form id="settingsForm" onsubmit="return false;">
      <label for="showLabelsCheckbox" style="display:block;margin-top:16px;">
        <input id="showLabelsCheckbox" type="checkbox" checked>
        Show animal label under the image
      </label>

      <label for="playImageNameCheckbox" style="display:block;margin-top:12px;">
        <input id="playImageNameCheckbox" type="checkbox">
        Play image name when opened
      </label>

      <fieldset style="margin-top:20px;padding:14px;border:1px solid #ddd;border-radius:8px;">
        <legend>Video Learning</legend>
        <label for="videoPauseSeconds">Pause after correct answer</label>
        <input id="videoPauseSeconds" type="number" min="0" max="60" step="1" value="3" aria-describedby="videoPauseHelp">
        <span id="videoPauseHelp">seconds (0-60)</span>
      </fieldset>

      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button id="saveBtn">Save</button>
        <button id="resetBtn" type="button" class="secondary">Reset to default</button>
        <a href="index.html" class="secondary" style="display:inline-block;padding:10px 14px;border-radius:8px;text-decoration:none;color:inherit;border:1px solid #ddd">Back to Dashboard</a>
      </div>

      <div id="status" aria-live="polite" style="margin-top:12px"></div>
    </form>
  </main>

  <script src="assets/js/settings.js"></script>
  <script>
    const $showLabels = document.getElementById('showLabelsCheckbox');
    const $playImageName = document.getElementById('playImageNameCheckbox');
    const $videoPauseSeconds = document.getElementById('videoPauseSeconds');
    const $save = document.getElementById('saveBtn');
    const $reset = document.getElementById('resetBtn');
    const $status = document.getElementById('status');

    function showStatus(msg, ms=1800){
      $status.textContent = msg;
      setTimeout(()=>{ $status.textContent=''; }, ms);
    }

    // initialize from stored settings
    document.addEventListener('DOMContentLoaded', ()=>{
      try{
        const showLabels = (window.MASettings && MASettings.getShowLabels && MASettings.getShowLabels());
        $showLabels.checked = showLabels;
        const playName = (window.MASettings && MASettings.getPlayImageName && MASettings.getPlayImageName());
        $playImageName.checked = playName;
        const pauseSeconds = (window.MASettings && MASettings.getVideoPauseSeconds && MASettings.getVideoPauseSeconds());
        $videoPauseSeconds.value = pauseSeconds;
      }catch(e){ $showLabels.checked = true; $playImageName.checked = false; }
    });

    $save.addEventListener('click', ()=>{
      if(window.MASettings && MASettings.setShowLabels) MASettings.setShowLabels($showLabels.checked);
      if(window.MASettings && MASettings.setPlayImageName) MASettings.setPlayImageName($playImageName.checked);
      if(window.MASettings && MASettings.setVideoPauseSeconds) MASettings.setVideoPauseSeconds($videoPauseSeconds.value);
      $videoPauseSeconds.value = window.MASettings.getVideoPauseSeconds();
      showStatus('Saved.');
    });

    $reset.addEventListener('click', ()=>{
      $showLabels.checked = true;
      $playImageName.checked = false;
      $videoPauseSeconds.value = 3;
      if(window.MASettings && MASettings.setShowLabels) MASettings.setShowLabels(true);
      if(window.MASettings && MASettings.setPlayImageName) MASettings.setPlayImageName(false);
      if(window.MASettings && MASettings.setVideoPauseSeconds) MASettings.setVideoPauseSeconds(3);
      showStatus('Reset to default.');
    });
  </script>
</body>
</html>
