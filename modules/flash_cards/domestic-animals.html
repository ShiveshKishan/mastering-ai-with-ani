<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Domestic Animals — MasteringAIWithAni</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
 </head>
<body>
  <header>
    <h1>Domestic Animals</h1>
    <div class="header-actions">
      <a class="close" href="../../index.html" aria-label="Close and return to dashboard">✕</a>
    </div>
  </header>

  <div id="progress" class="progress" aria-hidden="false" aria-label="Module progress"></div>

  <div class="controls">
  </div>

  <main>
    <div id="card" class="card" tabindex="0">
      <img id="image" class="image" src="../../assets/img/domestic-animals/cat.svg" alt="Cat" role="button" tabindex="0">
      <div id="caption" class="caption">Cat</div>
    </div>

    <div id="quizArea" class="panel hidden" aria-live="polite"></div>

    <div id="spellingArea" class="panel hidden">
      <input id="spellingInput" placeholder="Type the word" autocomplete="off">
      <button id="checkSpellingBtn">Check</button>
      <div id="spellingResult" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script src="../../assets/js/settings.js?v=1"></script>
  <script src="../../assets/js/domestic.js?v=2"></script>
</body>
</html>
